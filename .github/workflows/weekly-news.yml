name: Weekly news clipping

"on":
  schedule:
    - cron: '0 8 * * 6'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate artifacts without sending email'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-news
  cancel-in-progress: false

jobs:
  weekly-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEWS_TZ: America/Sao_Paulo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GMAILR_KEY: ${{ secrets.GMAILR_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: true
          extra-packages: |
            any::testthat
            any::yaml

      - name: Validate R syntax
        run: |
          Rscript -e "files <- c('agent_news.R', list.files('R', pattern='[.]R$', full.names=TRUE)); for (f in files) parse(f); cat('R syntax OK\n')"

      - name: Validate workflow YAML
        run: |
          Rscript -e "yaml::read_yaml('.github/workflows/weekly-news.yml'); cat('Workflow YAML OK\n')"

      - name: Run tests
        run: |
          Rscript tests/testthat.R

      - name: Run weekly agent
        run: |
          Rscript agent_news.R

      - name: Upload clipping artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-news-artifacts
          path: |
            outputs/*.html
            outputs/*.csv
            outputs/*.json
          if-no-files-found: warn
          retention-days: 30
