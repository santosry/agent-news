name: Diagnose secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GMAILR_KEY: ${{ secrets.GMAILR_KEY }}
      GMAILR_TOKEN_ENC_B64: ${{ secrets.GMAILR_TOKEN_ENC_B64 }}
      GMAIL_OAUTH_B64: ${{ secrets.GMAIL_OAUTH_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install minimal packages
        run: |
          Rscript -e "install.packages(c('jsonlite','openssl'), repos='https://cloud.r-project.org')"

      - name: Diagnose Gmail secrets (metadata only)
        run: |
          Rscript scripts/diagnose_secrets.R
