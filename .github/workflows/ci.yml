name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RENV_PATHS_CACHE: ~/.cache/R/renv
      DRY_RUN: "true"
      ALLOW_NO_DEEPSEEK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache renv packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore locked R dependencies
        run: |
          Rscript -e "install.packages('renv', repos='https://cloud.r-project.org'); renv::restore(prompt = FALSE)"

      - name: Validate R syntax
        run: |
          Rscript -e "files <- c('agent_news.R', list.files('R', pattern='[.]R$', full.names=TRUE, recursive=TRUE)); for (f in files) parse(f); cat('R syntax OK\n')"

      - name: Validate no secrets are tracked
        run: |
          Rscript scripts/validate_no_secrets.R

      - name: Run tests
        run: |
          Rscript tests/testthat.R
