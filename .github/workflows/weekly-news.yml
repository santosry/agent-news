name: Scheduled news clipping

"on":
  schedule:
    # GitHub Actions schedules use UTC.
    # Wednesday 10:00 UTC = Wednesday 07:00 America/Sao_Paulo.
    - cron: '0 10 * * 3'
    # Saturday 10:00 UTC = Saturday 07:00 America/Sao_Paulo.
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate artifacts without sending email'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-news
  cancel-in-progress: false

jobs:
  weekly-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEWS_TZ: America/Sao_Paulo
      NEWS_TIMEZONE_LABEL: Horário de Brasília
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ALLOW_NO_DEEPSEEK: ${{ vars.ALLOW_NO_DEEPSEEK || 'true' }}
      EMAIL_TRANSPORT: gmailr
      GMAILR_KEY: ${{ secrets.GMAILR_KEY }}
      GMAILR_TOKEN_ENC_B64: ${{ secrets.GMAILR_TOKEN_ENC_B64 }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      RENV_PATHS_CACHE: ~/.cache/R/renv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Cache locked R packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore locked R dependencies
        run: |
          Rscript -e "install.packages('renv', repos='https://cloud.r-project.org'); renv::restore(prompt = FALSE)"

      - name: Setup Gmail OAuth from secrets
        run: |
          if [ -n "$GMAILR_KEY" ] && [ -n "$GMAILR_TOKEN_ENC_B64" ]; then
            echo "$GMAILR_KEY" > /tmp/gmailr_key
            echo "$GMAILR_TOKEN_ENC_B64" | base64 -d > secrets/gmailr-token.rds.enc 2>/dev/null || true
            echo "Gmail token file created from secrets"
          else
            echo "Gmail secrets not configured. Email sending will be skipped."
          fi

      - name: Validate R syntax
        run: |
          Rscript -e "files <- c('agent_news.R', list.files('R', pattern='[.]R$', full.names=TRUE)); for (f in files) parse(f); cat('R syntax OK\n')"

      - name: Validate workflow YAML
        run: |
          Rscript -e "yaml::read_yaml('.github/workflows/weekly-news.yml'); cat('Workflow YAML OK\n')"

      - name: Validate no secrets are tracked
        run: |
          Rscript scripts/validate_no_secrets.R

      - name: Validate email delivery secrets
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          missing=""
          if [ -z "$GMAILR_KEY" ]; then missing="$missing GMAILR_KEY"; fi
          if [ -z "$GMAILR_TOKEN_ENC_B64" ]; then missing="$missing GMAILR_TOKEN_ENC_B64"; fi
          if [ -n "$missing" ]; then
            echo "::warning::Missing GitHub Actions secrets required for real email sending:$missing. Forcing dry-run mode."
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          else
            echo "Email delivery secrets configured"
          fi

      - name: Run tests
        run: |
          Rscript tests/testthat.R

      - name: Run benchmark smoke
        env:
          BENCHMARK_MAX_CANDIDATES_PER_SOURCE: 30
          BENCHMARK_CNN_MAX_PUBLIC_PAGES: 2
          BENCHMARK_IFF_MAX_PAGES: 2
          BENCHMARK_UENF_MAX_PAGES: 2
          BENCHMARK_NEWS_PER_SOURCE: 2
          BENCHMARK_MAX_SELECTED_NEWS: 8
        run: |
          Rscript scripts/benchmark_agent.R

      - name: Run weekly agent
        run: |
          Rscript agent_news.R

      - name: Upload clipping artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-news-artifacts
          path: |
            outputs/*.html
            outputs/*.csv
            outputs/*.json
          if-no-files-found: warn
          retention-days: 30
