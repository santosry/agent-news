name: Scheduled news clipping

"on":
  schedule:
    # GitHub Actions schedules use UTC.
    # Saturday 11:00 UTC = Saturday 08:00 America/Sao_Paulo.
    - cron: '0 11 * * 6'
    # Wednesday 20:00 UTC = Wednesday 17:00 America/Sao_Paulo.
    - cron: '0 20 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate artifacts without sending email'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-news
  cancel-in-progress: false

jobs:
  weekly-news:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEWS_TZ: America/Sao_Paulo
      NEWS_TIMEZONE_LABEL: Horário de Brasília
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALLOW_NO_OPENAI: ${{ vars.ALLOW_NO_OPENAI || 'true' }}
      EMAIL_TRANSPORT: gmailr
      GMAILR_KEY: ${{ secrets.GMAILR_KEY }}
      GMAILR_TOKEN_ENC_B64: ${{ secrets.GMAILR_TOKEN_ENC_B64 }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      RENV_PATHS_CACHE: ~/.cache/R/renv

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Cache locked R packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore locked R dependencies
        run: |
          Rscript -e "install.packages('renv', repos='https://cloud.r-project.org'); renv::restore(prompt = FALSE)"

      - name: Validate R syntax
        run: |
          Rscript -e "files <- c('agent_news.R', list.files('R', pattern='[.]R$', full.names=TRUE)); for (f in files) parse(f); cat('R syntax OK\n')"

      - name: Validate workflow YAML
        run: |
          Rscript -e "yaml::read_yaml('.github/workflows/weekly-news.yml'); cat('Workflow YAML OK\n')"

      - name: Validate no secrets are tracked
        run: |
          Rscript scripts/validate_no_secrets.R

      - name: Validate email delivery secrets
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          Rscript -e "missing <- character(); if (!nzchar(Sys.getenv('GMAILR_KEY'))) missing <- c(missing, 'GMAILR_KEY'); if (!nzchar(Sys.getenv('GMAILR_TOKEN_ENC_B64'))) missing <- c(missing, 'GMAILR_TOKEN_ENC_B64'); if (length(missing)) stop('Missing GitHub Actions secrets required for real email sending: ', paste(missing, collapse=', '), call.=FALSE); cat('Email delivery secrets configured\n')"

      - name: Run tests
        run: |
          Rscript tests/testthat.R

      - name: Run benchmark smoke
        env:
          BENCHMARK_MAX_CANDIDATES_PER_SOURCE: 30
          BENCHMARK_CNN_MAX_PUBLIC_PAGES: 2
          BENCHMARK_IFF_MAX_PAGES: 2
          BENCHMARK_UENF_MAX_PAGES: 2
          BENCHMARK_NEWS_PER_SOURCE: 2
          BENCHMARK_MAX_SELECTED_NEWS: 8
        run: |
          Rscript scripts/benchmark_agent.R

      - name: Run weekly agent
        run: |
          Rscript agent_news.R

      - name: Upload clipping artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-news-artifacts
          path: |
            outputs/*.html
            outputs/*.csv
            outputs/*.json
          if-no-files-found: warn
          retention-days: 30
